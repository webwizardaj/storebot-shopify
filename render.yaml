
services:
  - type: web
    name: storebot-shopify
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --timeout 120 --workers 1 app:app

    healthCheckPath: /health

    envVars:
      - key: SHOPIFY_STORE_DOMAIN
        sync: false

      - key: SHOPIFY_CLIENT_ID
        sync: false

      - key: SHOPIFY_CLIENT_SECRET
        sync: false

      - key: SHOPIFY_API_VERSION
        value: "2026-10"

      - key: GEMINI_API_KEY
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: STOREBOT_WEBHOOK_SECRET
        sync: false
